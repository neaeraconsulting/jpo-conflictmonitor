include:
  - docker-compose-ode.yml

services:
  conflictmonitor-build:
    profiles:
      - all
      - cm_full
      - cm_base
      - cm_build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAVEN_GITHUB_TOKEN: ${MAVEN_GITHUB_TOKEN:?error}
        MAVEN_GITHUB_ORG: ${MAVEN_GITHUB_ORG:?error}
    image: jpo-conflictmonitor:latest
    privileged: false  # Set true to allow writing to /proc/sys/vm/drop_caches
    restart: ${RESTART_POLICY}
    ports:
      - "8082:8082"
      - "10090:10090" # JMX
    environment:
      DOCKER_HOST_IP: ${DOCKER_HOST_IP:?error}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?error}
      spring.kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:?error}
      ROCKSDB_TOTAL_OFF_HEAP_MEMORY: ${ROCKSDB_TOTAL_OFF_HEAP_MEMORY:?error}
      ROCKSDB_INDEX_FILTER_BLOCK_RATIO: ${ROCKSDB_INDEX_FILTER_BLOCK_RATIO:?error}
      ROCKSDB_TOTAL_MEMTABLE_MEMORY: ${ROCKSDB_TOTAL_MEMTABLE_MEMORY:?error}
      ROCKSDB_BLOCK_SIZE: ${ROCKSDB_BLOCK_SIZE:?error}
      ROCKSDB_N_MEMTABLES: ${ROCKSDB_N_MEMTABLES:?error}
      ROCKSDB_MEMTABLE_SIZE: ${ROCKSDB_MEMTABLE_SIZE:?error}
      ENABLE_AGGREGATE_INTERSECTION_REFERENCE_ALIGNMENT_EVENTS: ${ENABLE_AGGREGATE_INTERSECTION_REFERENCE_ALIGNMENT_EVENTS:-false}
      ENABLE_AGGREGATE_SIGNAL_GROUP_ALIGNMENT_EVENTS: ${ENABLE_AGGREGATE_SIGNAL_GROUP_ALIGNMENT_EVENTS:-false}
      ENABLE_AGGREGATE_SIGNAL_STATE_CONFLICT_EVENTS: ${ENABLE_AGGREGATE_SIGNAL_STATE_CONFLICT_EVENTS:-false}
      ENABLE_AGGREGATE_MAP_MINIMUM_DATA_EVENTS: ${ENABLE_AGGREGATE_MAP_MINIMUM_DATA_EVENTS:-false}
      ENABLE_AGGREGATE_SPAT_TIME_CHANGE_DETAILS_EVENTS: ${ENABLE_AGGREGATE_SPAT_TIME_CHANGE_DETAILS_EVENTS:-false}
      ENABLE_AGGREGATE_SPAT_MINIMUM_DATA_EVENTS: ${ENABLE_AGGREGATE_SPAT_MINIMUM_DATA_EVENTS:-false}
      ENABLE_AGGREGATE_MAP_MESSAGE_COUNT_PROGRESSION: ${ENABLE_AGGREGATE_MAP_MESSAGE_COUNT_PROGRESSION:-false}
      ENABLE_AGGREGATE_SPAT_MESSAGE_COUNT_PROGRESSION: ${ENABLE_AGGREGATE_SPAT_MESSAGE_COUNT_PROGRESSION:-false}
      ENABLE_AGGREGATE_BSM_MESSAGE_COUNT_PROGRESSION: ${ENABLE_AGGREGATE_BSM_MESSAGE_COUNT_PROGRESSION:-false}
      ENABLE_AGGREGATE_EVENT_STATE_PROGRESSION: ${ENABLE_AGGREGATE_EVENT_STATE_PROGRESSION:-false}
      streams-config-replication-factor: ${CM_STREAMS_CONFIG_REPLICATION_FACTOR:-1}
      streams-config-acks: ${CM_STREAMS_CONFIG_ACKS:-1}
      streams-config-num-stream-threads: ${CM_STREAMS_CONFIG_NUM_STREAM_THREADS:-10}
      streams-config-cache-max-bytes-buffering: ${CM_STREAMS_CONFIG_CACHE_MAX_BYTES_BUFFERING:-1048576}
      streams-config-commit-interval-ms: ${CM_STREAMS_CONFIG_COMMIT_INTERVAL_MS:-100}
      streams-config-compression-type: ${CM_STREAMS_CONFIG_COMPRESSION_TYPE:-zstd}
      streams-config-linger-ms: ${CM_STREAMS_CONFIG_LINGER_MS:-10}
      streams-config-batch-size: ${CM_STREAMS_CONFIG_BATCH_SIZE:-16384}
      streams-config-topology-optimization: ${CM_STREAMS_CONFIG_TOPOLOGY_OPTIMIZATION:-all}
    healthcheck:
      test: ["CMD", "java", "-version"]
      interval: 10s
      timeout: 10s
      retries: 20
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      kafka:
        condition: service_healthy
        required: false

  conflictmonitor-release:
    profiles:
      - cm_release
    image: usdotjpoode/jpo-conflictmonitor:latest
    restart: ${RESTART_POLICY}
    ports:
      - "8082:8082"
    environment:
      DOCKER_HOST_IP: ${DOCKER_HOST_IP:?error}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?error}
      spring.kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:?error}
      ROCKSDB_TOTAL_OFF_HEAP_MEMORY: ${ROCKSDB_TOTAL_OFF_HEAP_MEMORY:?error}
      ROCKSDB_INDEX_FILTER_BLOCK_RATIO: ${ROCKSDB_INDEX_FILTER_BLOCK_RATIO:?error}
      ROCKSDB_TOTAL_MEMTABLE_MEMORY: ${ROCKSDB_TOTAL_MEMTABLE_MEMORY:?error}
      ROCKSDB_BLOCK_SIZE: ${ROCKSDB_BLOCK_SIZE:?error}
      ROCKSDB_N_MEMTABLES: ${ROCKSDB_N_MEMTABLES:?error}
      ROCKSDB_MEMTABLE_SIZE: ${ROCKSDB_MEMTABLE_SIZE:?error}
      ENABLE_AGGREGATE_INTERSECTION_REFERENCE_ALIGNMENT_EVENTS: ${ENABLE_AGGREGATE_INTERSECTION_REFERENCE_ALIGNMENT_EVENTS:-false}
      ENABLE_AGGREGATE_SIGNAL_GROUP_ALIGNMENT_EVENTS: ${ENABLE_AGGREGATE_SIGNAL_GROUP_ALIGNMENT_EVENTS:-false}
      ENABLE_AGGREGATE_SIGNAL_STATE_CONFLICT_EVENTS: ${ENABLE_AGGREGATE_SIGNAL_STATE_CONFLICT_EVENTS:-false}
      ENABLE_AGGREGATE_MAP_MINIMUM_DATA_EVENTS: ${ENABLE_AGGREGATE_MAP_MINIMUM_DATA_EVENTS:-false}
      ENABLE_AGGREGATE_SPAT_TIME_CHANGE_DETAILS_EVENTS: ${ENABLE_AGGREGATE_SPAT_TIME_CHANGE_DETAILS_EVENTS:-false}
      ENABLE_AGGREGATE_SPAT_MINIMUM_DATA_EVENTS: ${ENABLE_AGGREGATE_SPAT_MINIMUM_DATA_EVENTS:-false}
      ENABLE_AGGREGATE_MAP_MESSAGE_COUNT_PROGRESSION: ${ENABLE_AGGREGATE_MAP_MESSAGE_COUNT_PROGRESSION:-false}
      ENABLE_AGGREGATE_SPAT_MESSAGE_COUNT_PROGRESSION: ${ENABLE_AGGREGATE_SPAT_MESSAGE_COUNT_PROGRESSION:-false}
      ENABLE_AGGREGATE_BSM_MESSAGE_COUNT_PROGRESSION: ${ENABLE_AGGREGATE_BSM_MESSAGE_COUNT_PROGRESSION:-false}
      ENABLE_AGGREGATE_EVENT_STATE_PROGRESSION: ${ENABLE_AGGREGATE_EVENT_STATE_PROGRESSION:-false}
      streams-config-replication-factor: ${CM_STREAMS_CONFIG_REPLICATION_FACTOR:-1}
      streams-config-acks: ${CM_STREAMS_CONFIG_ACKS:-1}
      streams-config-num-stream-threads: ${CM_STREAMS_CONFIG_NUM_STREAM_THREADS:-10}
      streams-config-cache-max-bytes-buffering: ${CM_STREAMS_CONFIG_CACHE_MAX_BYTES_BUFFERING:-1048576}
      streams-config-commit-interval-ms: ${CM_STREAMS_CONFIG_COMMIT_INTERVAL_MS:-100}
      streams-config-compression-type: ${CM_STREAMS_CONFIG_COMPRESSION_TYPE:-zstd}
      streams-config-linger-ms: ${CM_STREAMS_CONFIG_LINGER_MS:-10}
      streams-config-batch-size: ${CM_STREAMS_CONFIG_BATCH_SIZE:-16384}
      streams-config-topology-optimization: ${CM_STREAMS_CONFIG_TOPOLOGY_OPTIMIZATION:-all}
    healthcheck:
      test: ["CMD", "java", "-version"]
      interval: 10s
      timeout: 10s
      retries: 20
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 4G
    depends_on:
      kafka:
        condition: service_healthy
        required: false


