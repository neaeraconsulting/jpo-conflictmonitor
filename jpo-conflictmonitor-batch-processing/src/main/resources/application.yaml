server.port: 8055


spring:
  application:
    name: jpo-atspm-spat-validation-service
  groovy:
    template:
      check-template-location: false
  thymeleaf:
    check-template-location: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSZ
    time-zone: UTC

  data:
    # Mongo properties ref:
    # https://docs.spring.io/spring-boot/appendix/application-properties/index.html#application-properties.data.spring.mongodb.additional-hosts
    mongodb:
      database: ${CM_DATABASE_NAME:CV}
      host: ${DB_HOST_IP:localhost}
      port: ${MONGO_PORT:27017}
      username: ${MONGO_READ_WRITE_USER:ode}
      password: ${MONGO_READ_WRITE_PASS:replace_me}
      authentication-database: ${CM_MONGO_AUTH_DB:admin}
      # uri overrides individual properties above if it is set
      # https://docs.spring.io/spring-boot/appendix/application-properties/index.html#application-properties.data.spring.mongodb.uri
      #uri: ${CM_MONGO_URI:mongodb://ode:replace_me@localhost:27017/CV}

cm:
  batch:
    # Enables TestController's /test/** debug endpoints, which proxy ATSPM queries and can
    # expose the live ATSPM access token. Disabled by default - only set to true for local
    # development/testing, never in a shared or production environment.
    test-controller:
      enabled: ${CM_TEST_CONTROLLER_ENABLED:false}
    scheduler:
      thread.pool.size: 10
      # Set to false to disable starting the batch algorithms on application startup,
      # e.g. for tests that only need the Spring context to load.
      enabled: true
    # Clock config:
    # In normal operation, set offset to false for system time.
    # Or for testing or historical queries, set to true with start-timestamp set to the
    # time in the past to start querying from.
    clock:
      offset: false
      start-timestamp: "2026-04-26T02:30:00Z" # ignored if offset is false
    atspm.spat.validation:
      algorithm: defaultAtspmSpatValidationAlgorithm
      client:
        base-url: ${CM_ATSPM_CLIENT_BASE_URL:http://localhost:8055}
        username: ${CM_ATSPM_CLIENT_USERNAME:username}
        password: ${CM_ATSPM_CLIENT_PASSWORD:password}
      local-time-zone: "America/Denver"
      interval: 1
      interval-units: HOURS
      task-start-time-stagger: 2
      task-start-time-stagger-units: MINUTES
      # grace-period: Offset time to run scheduled queries.
      # Set to an appropriate offset to ensure all data is present in the ATSPM and CIMMS databases for the
      # time period being queried.
      # It's not recommended to set this to 0, as current data in transit might be missed.
      grace-period-offset: 1
      grace-period-offset-units: HOURS
      ## Sample Route Configuration
      routes:
