name: CI
on: 
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [develop, master]

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: 'maven'
      - name: Run Sonar on Conflict Monitor
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          MAVEN_GITHUB_TOKEN_NAME: ${{ vars.MAVEN_GITHUB_TOKEN_NAME }}
          MAVEN_GITHUB_TOKEN: ${{ secrets.MAVEN_GITHUB_TOKEN }}
          MAVEN_GITHUB_ORG: ${{ github.repository_owner }}
        run: |
          cd jpo-conflictmonitor/
          mvn -s ../settings.xml -e clean org.jacoco:jacoco-maven-plugin:prepare-agent package sonar:sonar \
            -Dsonar.projectKey=${{ github.repository_owner }}_jpo-conflictmonitor \
            -Dsonar.projectName=jpo-conflictmonitor \
            -Dsonar.organization=${{ github.repository_owner }} \
            -Dsonar.host.url=https://sonarcloud.io 

  sonar-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: 'maven'
      - name: Run Sonar on Conflict Monitor Batch Processing Project
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          MAVEN_GITHUB_TOKEN_NAME: ${{ vars.MAVEN_GITHUB_TOKEN_NAME }}
          MAVEN_GITHUB_TOKEN: ${{ secrets.MAVEN_GITHUB_TOKEN }}
          MAVEN_GITHUB_ORG: ${{ github.repository_owner }}
        run: |
          cd jpo-conflictmonitor-batch-processing/
          mvn -s ../settings.xml -e clean org.jacoco:jacoco-maven-plugin:prepare-agent package sonar:sonar \
            -Dsonar.projectKey=${{ github.repository_owner }}_jpo-conflictmonitor-batch-processing \
            -Dsonar.projectName=jpo-conflictmonitor-batch-processing \
            -Dsonar.organization=${{ github.repository_owner }} \
            -Dsonar.host.url=https://sonarcloud.io 

  # Run unit tests if not USDOT
  unit-tests:
    if: github.event.pull_request.base.repo.owner.login != 'usdot-jpo-ode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: 'maven'
      - name: Run Unit Tests
        env:
          MAVEN_GITHUB_TOKEN_NAME: ${{ vars.MAVEN_GITHUB_TOKEN_NAME }}
          MAVEN_GITHUB_TOKEN: ${{ secrets.MAVEN_GITHUB_TOKEN }}
          MAVEN_GITHUB_ORG: ${{ github.repository_owner }}
        run: |
          cd jpo-conflictmonitor/
          mvn -s ../settings.xml --batch-mode test

  batch-unit-tests:
    if: github.event.pull_request.base.repo.owner.login != 'usdot-jpo-ode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: 'maven'
      - name: Run Unit Tests
        env:
          MAVEN_GITHUB_TOKEN_NAME: ${{ vars.MAVEN_GITHUB_TOKEN_NAME }}
          MAVEN_GITHUB_TOKEN: ${{ secrets.MAVEN_GITHUB_TOKEN }}
          MAVEN_GITHUB_ORG: ${{ github.repository_owner }}
        run: |
          cd jpo-conflictmonitor-batch-processing/
          mvn -s settings.xml --batch-mode test
